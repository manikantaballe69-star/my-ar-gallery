<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

<button id="startButton"
style="position:fixed;z-index:9999;top:20px;left:20px;padding:12px;">
Start AR Experience
</button>

<a-scene
mindar-image="imageTargetSrc: targets.mind;"
color-space="sRGB"
renderer="colorManagement: true"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false">

<a-assets>
  <video id="video1" src="video1.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video2" src="video2.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video3" src="video3.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video4" src="video4.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video5" src="video5.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video6" src="video6.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video7" src="video7.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video8" src="video8.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video9" src="video9.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video10" src="video10.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video11" src="video11.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video12" src="video12.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video13" src="video13.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video14" src="video14.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video15" src="video15.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video16" src="video16.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="video17" src="video17.mp4" loop playsinline crossorigin="anonymous"></video>

  <video id="akka" src="akka.mp4" loop playsinline crossorigin="anonymous"></video>
  <video id="godavari" src="godavari.mp4" loop playsinline crossorigin="anonymous"></video>
</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>

<a-entity mindar-image-target="targetIndex: 0">

<a-video
src="#video1"
width="1.5"
height="1"
position="0 0 0">
</a-video>

</a-entity>

<a-entity mindar-image-target="targetIndex: 1">
  <a-video src="#video2" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 2">
  <a-video src="#video3" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 3">
  <a-video src="#video4" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 4">
  <a-video src="#video5" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 5">
  <a-video src="#video6" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 6">
  <a-video src="#video7" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 7">
  <a-video src="#video8" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 8">
  <a-video src="#video9" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 9">
  <a-video src="#video10" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 10">
  <a-video src="#video11" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 11">
  <a-video src="#video12" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 12">
  <a-video src="#video13" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 13">
  <a-video src="#video14" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 14">
  <a-video src="#video15" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 15">
  <a-video src="#video16" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 16">
  <a-video src="#video17" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 17">
  <a-video src="#akka" width="1.5" height="1"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 18">
  <a-video src="#godavari" width="1.5" height="1"></a-video>
</a-entity>

</a-scene>

<script>
document.getElementById("startButton").addEventListener("click", () => {

  const videos = document.querySelectorAll("video");

  videos.forEach(v => {
    v.muted = false;
    v.play().catch(() => {});
  });

  document.getElementById("startButton").style.display = "none";
});
</script>

</body>
</html>
